# Stream mode overlay for Kitty
# Applied via: kitty @ --to unix:/tmp/kitty-socket set-font-size 14
# Reverted via: kitty @ --to unix:/tmp/kitty-socket set-font-size 11
#
# This file documents the stream mode settings.
# The actual toggling is done by stream-toggle.sh using kitty remote control.
#
# Stream mode changes:
#   font_size        11 -> 14
#   background_opacity 0.90 -> 1.0
