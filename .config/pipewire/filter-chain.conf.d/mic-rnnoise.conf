# Clean Mic — RNNoise noise suppression via PipeWire filter chain
# Creates a virtual "Clean Mic" audio source for OBS / other apps
# Plugin: /usr/lib/ladspa/librnnoise_ladspa.so (noise-suppression-for-voice)
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Clean Mic"
            media.name       = "Clean Mic"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = "librnnoise_ladspa"
                        label  = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" 50.0
                        }
                    }
                ]
            }
            audio.rate = 48000
            audio.position = [ MONO ]
            capture.props = {
                node.name = "capture.clean_mic"
                node.passive = true
            }
            playback.props = {
                node.name = "clean_mic"
                media.class = Audio/Source
            }
        }
    }
]
